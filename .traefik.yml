displayName: KEPA Tenant Header
type: middleware
iconPath: .assets/icon.png
import: github.com/knownasred/traefik-subdomain-plugin
summary: Extract a tenant from the request host into a configurable upstream header.
testData:
  hostRegex: '^([^.]+)\.app\.kepa\.ch$'
  headerName: X-Tenant
  captureGroup: 1
